host: '127.0.0.1'
port: 4133
web_root: './public'
debug_mode: true
matrix_mode: true
mirror_mode: false

# The language templates are written in, used when a request's Accept-Language doesn't match any translations.
source_locale: 'en'

content_types:
  html: text/html
  css: text/css
  js: text/javascript
  txt: text/plain
  jpg: image/jpeg
  png: image/png
  svg: image/svg+xml
